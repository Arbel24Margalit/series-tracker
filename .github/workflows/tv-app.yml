name: Build TV app

on:
  push:
    branches: [main]
    paths: ['tv-app/**', '.github/workflows/tv-app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        id: build
        working-directory: tv-app
        env:
          VERSION_CODE: ${{ github.run_number }}
          TV_KEYSTORE_B64: ${{ secrets.TV_KEYSTORE_B64 }}
          TV_KEYSTORE_PASS: ${{ secrets.TV_KEYSTORE_PASS }}
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
            # One fixed signing key, kept in the repo's secrets, so updates install over the old app.
            if [ -z "$TV_KEYSTORE_B64" ] || [ -z "$TV_KEYSTORE_PASS" ]; then
              echo "Missing secrets TV_KEYSTORE_B64 / TV_KEYSTORE_PASS - the fixed signing key is not set up."
              exit 1
            fi
            export KEYSTORE_PASS="$TV_KEYSTORE_PASS"
            export KEYSTORE_FILE="$RUNNER_TEMP/key.jks"
            echo "$TV_KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
            curl -sSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
            "$RUNNER_TEMP/gradle-8.14.3/bin/gradle" --no-daemon assembleRelease
          } 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Publish the APK on the site
        if: success()
        run: |
          cp tv-app/app/build/outputs/apk/release/app-release.apk tv.apk
          echo '{ "versionCode": ${{ github.run_number }}, "apk": "tv.apk" }' > version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch tv-app/build.log
          git add tv.apk version.json
          git commit -m "Build TV app (run ${{ github.run_number }})" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save the log when the build fails
        if: failure()
        run: |
          tail -c 60000 "$RUNNER_TEMP/build.log" > tv-app/build.log || echo "no log" > tv-app/build.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tv-app/build.log
          git commit -m "TV app build failed (run ${{ github.run_number }}) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
