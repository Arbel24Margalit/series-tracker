name: Build TV app

on:
  push:
    branches: [main]
    paths: ['tv-app/**', '.github/workflows/tv-app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build
        working-directory: tv-app
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export KEYSTORE_PASS="$(openssl rand -hex 16)"
          export KEYSTORE_FILE="$RUNNER_TEMP/key.jks"
          keytool -genkeypair -keystore "$KEYSTORE_FILE" -alias seriestv -keyalg RSA -keysize 2048 \
            -validity 20000 -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -dname "CN=Series TV"
          gradle --no-daemon assembleRelease
      - name: Publish the APK on the site
        run: |
          cp tv-app/app/build/outputs/apk/release/app-release.apk tv.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tv.apk
          git commit -m "Build TV app (run ${{ github.run_number }})" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
