plugins { id 'com.android.application' }

android {
    namespace 'io.github.arbel.seriestv'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.arbel.seriestv'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0'
    }

    // The signing key is created fresh by the build and never stored in the repo.
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'missing.jks')
            storePassword System.getenv('KEYSTORE_PASS')
            keyAlias 'seriestv'
            keyPassword System.getenv('KEYSTORE_PASS')
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
