name: Build TV app

on:
  push:
    branches: [main]
    paths: ['tv-app/**', '.github/workflows/tv-app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        id: build
        working-directory: tv-app
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
            export KEYSTORE_PASS="$(openssl rand -hex 16)"
            export KEYSTORE_FILE="$RUNNER_TEMP/key.jks"
            keytool -genkeypair -keystore "$KEYSTORE_FILE" -alias seriestv -keyalg RSA -keysize 2048 \
              -validity 20000 -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -dname "CN=Series TV"
            curl -sSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
            "$RUNNER_TEMP/gradle-8.14.3/bin/gradle" --no-daemon assembleRelease
          } 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Publish the APK on the site
        if: success()
        run: |
          cp tv-app/app/build/outputs/apk/release/app-release.apk tv.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch tv-app/build.log
          git add tv.apk
          git commit -m "Build TV app (run ${{ github.run_number }})" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save the log when the build fails
        if: failure()
        run: |
          tail -c 60000 "$RUNNER_TEMP/build.log" > tv-app/build.log || echo "no log" > tv-app/build.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tv-app/build.log
          git commit -m "TV app build failed (run ${{ github.run_number }}) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
